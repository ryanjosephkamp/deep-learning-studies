<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112">
<!-- A drawn face on the 112-pixel aligned crop: the eyes, nose tip, and mouth corners sit on the
     alignment template's five landmarks, as an aligned photo's do. -->
<defs>
<radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#d9cfbb"/><stop offset="1" stop-color="#a99d86"/></radialGradient>
<linearGradient id="skin" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0" stop-color="#e2c3a4"/><stop offset="0.55" stop-color="#ecd2b6"/><stop offset="1" stop-color="#dcb998"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a20"/><stop offset="1" stop-color="#2a1d16"/></linearGradient>
<clipPath id="face"><path d="M17,40 C15,63 19,83 31,99 C39,109 48,115 56,115 C64,115 73,109 81,99 C93,83 97,63 95,40 C93,22 77,13 56,13 C35,13 19,22 17,40 Z"/></clipPath>
</defs>
<rect width="112" height="112" fill="url(#bg)"/>
<!-- neck and shoulders -->
<path d="M40,104 C40,110 39,114 38,118 L74,118 C73,114 72,110 72,104 Z" fill="#d8b896" stroke="#3b2c22" stroke-width="0.7"/>
<path d="M2,118 C6,110 22,106 38,107 L74,107 C90,106 106,110 110,118 Z" fill="#4a5560" stroke="#22282e" stroke-width="0.7"/>
<!-- hair behind the head -->
<path d="M13,62 C8,30 26,5 56,5 C86,5 104,30 99,62 C98,52 97,46 95,42 C90,22 74,14 56,14 C38,14 22,22 17,42 C15,46 14,52 13,62 Z" fill="url(#hair)"/>
<!-- ears -->
<path d="M18,49 C11,47 9,58 12,65 C14,70 18,71 20,68" fill="#e0bf9f" stroke="#3b2c22" stroke-width="0.8"/>
<path d="M94,49 C101,47 103,58 100,65 C98,70 94,71 92,68" fill="#e0bf9f" stroke="#3b2c22" stroke-width="0.8"/>
<path d="M15,55 C14,59 15,63 17,65" fill="none" stroke="#7a5a44" stroke-width="0.6"/>
<path d="M97,55 C98,59 97,63 95,65" fill="none" stroke="#7a5a44" stroke-width="0.6"/>
<!-- face -->
<path d="M17,40 C15,63 19,83 31,99 C39,109 48,115 56,115 C64,115 73,109 81,99 C93,83 97,63 95,40 C93,22 77,13 56,13 C35,13 19,22 17,40 Z" fill="url(#skin)"/>
<g clip-path="url(#face)" fill="none" stroke="#9a6f52" stroke-width="0.4" opacity="0.32">
<!-- cheek and jaw shading, hatched as an engraver would -->
<path d="M20,60 L28,82 M22,58 L31,84 M24,60 L33,86 M19,66 L26,86"/>
<path d="M92,60 L84,82 M90,58 L81,84 M88,62 L80,84"/>
<path d="M44,104 L48,110 M48,104 L52,111 M60,104 L64,110"/>
<path d="M47,79 L52,79 M60,79 L65,79"/>
</g>
<!-- hair over the forehead, parted on one side -->
<path d="M16,46 C16,26 32,12 56,12 C80,12 96,26 96,46 C93,34 86,27 76,24.5 C70,23.5 66,24.5 62,26.5 C58,23 52,21.5 46,21.8 C32,22.6 21,31 16,46 Z" fill="url(#hair)"/>
<path d="M62,26.5 C60,21 57,16 52,13 M70,24 C74,19 79,17 84,18 M40,22.5 C34,22 28,24 24,28" fill="none" stroke="#5a4334" stroke-width="0.5"/>
<!-- outline of the face -->
<path d="M17,40 C15,63 19,83 31,99 C39,109 48,115 56,115 C64,115 73,109 81,99 C93,83 97,63 95,40" fill="none" stroke="#3b2c22" stroke-width="0.9"/>
<!-- brows -->
<path d="M28.5,44.5 C32,41 40,40.2 46.5,42.6" fill="none" stroke="#2a1d16" stroke-width="2" stroke-linecap="round"/>
<path d="M65.5,42.4 C72,40 80,40.8 83.5,44.3" fill="none" stroke="#2a1d16" stroke-width="2" stroke-linecap="round"/>
<!-- eyes, centered on the template's eye landmarks (38.29, 51.70) and (73.53, 51.50) -->
<path d="M31.2,51.9 C34.2,48.4 42.3,48.3 45.4,51.7 C42.2,54.7 34.4,54.8 31.2,51.9 Z" fill="#f7f1e6" stroke="#2a1d16" stroke-width="0.8"/>
<path d="M66.4,51.6 C69.6,48.2 77.5,48.3 80.6,51.8 C77.3,54.6 69.6,54.6 66.4,51.6 Z" fill="#f7f1e6" stroke="#2a1d16" stroke-width="0.8"/>
<circle cx="38.29" cy="51.70" r="2.7" fill="#5b4632"/><circle cx="38.29" cy="51.70" r="1.25" fill="#120c08"/><circle cx="37.4" cy="50.8" r="0.55" fill="#fff"/>
<circle cx="73.53" cy="51.50" r="2.7" fill="#5b4632"/><circle cx="73.53" cy="51.50" r="1.25" fill="#120c08"/><circle cx="72.6" cy="50.6" r="0.55" fill="#fff"/>
<path d="M31.5,51.6 C34.5,48 42,47.6 45.2,51.2" fill="none" stroke="#1c140f" stroke-width="1.1"/>
<path d="M66.7,51.2 C70,47.6 77.5,47.9 80.4,51.5" fill="none" stroke="#1c140f" stroke-width="1.1"/>
<path d="M33,56.2 C36,57.6 41,57.5 44,55.8" fill="none" stroke="#9a6f52" stroke-width="0.5"/>
<path d="M68,55.8 C71,57.4 76,57.5 79,56" fill="none" stroke="#9a6f52" stroke-width="0.5"/>
<!-- nose, its tip on the template's nose landmark (56.03, 71.74) -->
<path d="M52.6,54 C52.2,60 51.2,65 49.6,69" fill="none" stroke="#9a6f52" stroke-width="0.7"/>
<path d="M49.8,69.2 C47.6,71.4 48.4,74.2 51.2,74.1 C52.6,75.6 54.6,76 56.03,75.4 C57.5,76 59.5,75.6 60.9,74.1 C63.6,74.2 64.4,71.4 62.2,69.2" fill="none" stroke="#3b2c22" stroke-width="0.8"/>
<path d="M51.6,73.3 C52.4,72.6 53.4,72.6 54.1,73.4 M57.9,73.4 C58.6,72.6 59.6,72.6 60.4,73.3" fill="none" stroke="#3b2c22" stroke-width="0.6"/>
<ellipse cx="56.03" cy="70.6" rx="3.4" ry="2.4" fill="#f4dcc4" opacity="0.6"/>
<!-- mouth, its corners on the template's mouth landmarks (41.55, 92.37) and (70.73, 92.20) -->
<path d="M41.55,92.37 C45.5,89.4 51,88.4 56,89.9 C61,88.4 66.6,89.3 70.73,92.2 C66,93.3 61,93.6 56,93.4 C51,93.6 46,93.4 41.55,92.37 Z" fill="#b5665a" stroke="#4a2a24" stroke-width="0.6"/>
<path d="M41.55,92.37 C46,93.4 51,93.6 56,93.4 C61,93.6 66,93.3 70.73,92.2 C67,97.6 61,99.4 56,99.4 C51,99.4 45,97.6 41.55,92.37 Z" fill="#c4766a" stroke="#4a2a24" stroke-width="0.6"/>
<path d="M41.55,92.37 C47,93.3 51,93.5 56,93.3 C61,93.5 65,93.2 70.73,92.2" fill="none" stroke="#3a1f1a" stroke-width="0.9"/>
<path d="M50,96.6 C54,97.6 58,97.6 62,96.6" fill="none" stroke="#e8a99a" stroke-width="0.7" opacity="0.8"/>
<path d="M51,103.5 C54,104.6 58,104.6 61,103.5" fill="none" stroke="#9a6f52" stroke-width="0.6"/>
</svg>
